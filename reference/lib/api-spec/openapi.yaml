openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Professional Management Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: profile
  - name: overview
  - name: teacher
  - name: freelancer
  - name: entrepreneur
  - name: files
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current user profile and enabled areas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /overview:
    get:
      operationId: getOverview
      tags: [overview]
      summary: Get cross-workspace dashboard totals
      responses:
        "200":
          description: Overview summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /activity:
    get:
      operationId: getActivity
      tags: [overview]
      summary: Get recent activity across workspaces
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /students:
    get:
      operationId: listStudents
      tags: [teacher]
      summary: List students
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [teacher]
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{id}:
    get:
      operationId: getStudent
      tags: [teacher]
      summary: Get a student profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [teacher]
      summary: Update a student
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [teacher]
      summary: Delete a student
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /sessions:
    get:
      operationId: listSessions
      tags: [teacher]
      summary: List teaching sessions
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [teacher]
      summary: Create a teaching session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{id}:
    patch:
      operationId: updateSession
      tags: [teacher]
      summary: Update a teaching session
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: deleteSession
      tags: [teacher]
      summary: Delete a teaching session
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /curricula:
    get:
      operationId: listCurricula
      tags: [teacher]
      summary: List curricula
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Curricula
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Curriculum"
    post:
      operationId: createCurriculum
      tags: [teacher]
      summary: Create curriculum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumInput"
      responses:
        "201":
          description: Created curriculum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
  /curricula/{id}:
    patch:
      operationId: updateCurriculum
      tags: [teacher]
      summary: Update curriculum
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumUpdate"
      responses:
        "200":
          description: Updated curriculum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
    delete:
      operationId: deleteCurriculum
      tags: [teacher]
      summary: Delete curriculum
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /freelancer-projects:
    get:
      operationId: listFreelancerProjects
      tags: [freelancer]
      summary: List freelancer projects
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Freelancer projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreelancerProject"
    post:
      operationId: createFreelancerProject
      tags: [freelancer]
      summary: Create freelancer project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreelancerProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerProject"
  /freelancer-projects/{id}:
    patch:
      operationId: updateFreelancerProject
      tags: [freelancer]
      summary: Update freelancer project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreelancerProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerProject"
    delete:
      operationId: deleteFreelancerProject
      tags: [freelancer]
      summary: Delete freelancer project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /freelancer-projects/{projectId}/time-entries:
    get:
      operationId: listTimeEntries
      tags: [freelancer]
      summary: List time entries for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [freelancer]
      summary: Add time to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "201":
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
  /proposals:
    get:
      operationId: listProposals
      tags: [freelancer]
      summary: List proposal experiments
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
    post:
      operationId: createProposal
      tags: [freelancer]
      summary: Create proposal experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "201":
          description: Created proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
  /proposals/{id}:
    patch:
      operationId: updateProposal
      tags: [freelancer]
      summary: Update proposal experiment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalUpdate"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
    delete:
      operationId: deleteProposal
      tags: [freelancer]
      summary: Delete proposal experiment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /expenses:
    get:
      operationId: listExpenses
      tags: [freelancer]
      summary: List freelancer expenses
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [freelancer]
      summary: Create expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /expenses/{id}:
    delete:
      operationId: deleteExpense
      tags: [freelancer]
      summary: Delete expense
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /venture-projects:
    get:
      operationId: listVentureProjects
      tags: [entrepreneur]
      summary: List entrepreneur projects
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Entrepreneur projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentureProject"
    post:
      operationId: createVentureProject
      tags: [entrepreneur]
      summary: Create entrepreneur project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentureProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureProject"
  /venture-projects/{id}:
    patch:
      operationId: updateVentureProject
      tags: [entrepreneur]
      summary: Update entrepreneur project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentureProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureProject"
    delete:
      operationId: deleteVentureProject
      tags: [entrepreneur]
      summary: Delete entrepreneur project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /ideas:
    get:
      operationId: listIdeas
      tags: [entrepreneur]
      summary: List ideas
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
    post:
      operationId: createIdea
      tags: [entrepreneur]
      summary: Create idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
  /ideas/{id}:
    patch:
      operationId: updateIdea
      tags: [entrepreneur]
      summary: Update idea
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdate"
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    delete:
      operationId: deleteIdea
      tags: [entrepreneur]
      summary: Delete idea
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List file metadata
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileRecord"
    post:
      operationId: createFileRecord
      tags: [files]
      summary: Save uploaded file metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRecordInput"
      responses:
        "201":
          description: Created file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
  /files/{id}:
    delete:
      operationId: deleteFileRecord
      tags: [files]
      summary: Delete file metadata
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [files]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlInput"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResult"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
    Month:
      name: month
      in: query
      description: Calendar month in YYYY-MM format
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Profile:
      type: object
      required: [id, name, email, initials, teacherEnabled, freelancerEnabled, entrepreneurEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        initials: { type: string }
        teacherEnabled: { type: boolean }
        freelancerEnabled: { type: boolean }
        entrepreneurEnabled: { type: boolean }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        teacherEnabled: { type: boolean }
        freelancerEnabled: { type: boolean }
        entrepreneurEnabled: { type: boolean }
    Overview:
      type: object
      required: [teaching, freelancer, entrepreneur]
      properties:
        teaching:
          $ref: "#/components/schemas/TeachingSummary"
        freelancer:
          $ref: "#/components/schemas/FreelancerSummary"
        entrepreneur:
          $ref: "#/components/schemas/EntrepreneurSummary"
    TeachingSummary:
      type: object
      required: [confirmedIncome, estimatedIncome, hours, sessions, students, averageRate]
      properties:
        confirmedIncome: { type: number }
        estimatedIncome: { type: number }
        hours: { type: number }
        sessions: { type: integer }
        students: { type: integer }
        averageRate: { type: number }
    FreelancerSummary:
      type: object
      required: [confirmedIncome, estimatedIncome, expenses, netIncome, projects, hours]
      properties:
        confirmedIncome: { type: number }
        estimatedIncome: { type: number }
        expenses: { type: number }
        netIncome: { type: number }
        projects: { type: integer }
        hours: { type: number }
    EntrepreneurSummary:
      type: object
      required: [activeProjects, ideas, inDevelopment, completed]
      properties:
        activeProjects: { type: integer }
        ideas: { type: integer }
        inDevelopment: { type: integer }
        completed: { type: integer }
    ActivityItem:
      type: object
      required: [id, title, description, module, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        module: { type: string }
        createdAt: { type: string, format: date-time }
    Student:
      type: object
      required: [id, name, parentName, email, age, grade, subjects, curriculum, status, sessionsCount]
      properties:
        id: { type: integer }
        name: { type: string }
        parentName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        age: { type: integer }
        grade: { type: string }
        subjects:
          type: array
          items: { type: string }
        notes: { type: string }
        curriculum: { type: string }
        hourlyRate: { type: ["number", "null"] }
        status: { type: string, enum: [active, inactive] }
        sessionsCount: { type: integer }
    StudentInput:
      type: object
      required: [name, parentName, email, age, grade, subjects, curriculum, status]
      properties:
        name: { type: string, minLength: 1 }
        parentName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        age: { type: integer, minimum: 1 }
        grade: { type: string }
        subjects:
          type: array
          items: { type: string }
        notes: { type: string }
        curriculum: { type: string }
        hourlyRate: { type: ["number", "null"] }
        status: { type: string, enum: [active, inactive] }
    StudentUpdate:
      allOf:
        - $ref: "#/components/schemas/StudentInput"
    Session:
      type: object
      required: [id, studentId, studentName, className, date, duration, hourlyRate, calculatedCost, status, paymentStatus, notes]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        studentName: { type: string }
        className: { type: string }
        date: { type: string, format: date }
        duration: { type: number }
        hourlyRate: { type: number }
        calculatedCost: { type: number }
        status: { type: string, enum: [planned, taught, not_taught, cancelled] }
        paymentStatus: { type: string, enum: [pending, confirmed] }
        notes: { type: string }
    SessionInput:
      type: object
      required: [studentId, className, date, duration, hourlyRate, status]
      properties:
        studentId: { type: integer }
        className: { type: string, minLength: 1 }
        date: { type: string, format: date }
        duration: { type: number, minimum: 0.01 }
        hourlyRate: { type: number, minimum: 0 }
        status: { type: string, enum: [planned, taught, not_taught, cancelled] }
        notes: { type: string }
    SessionUpdate:
      allOf:
        - $ref: "#/components/schemas/SessionInput"
    Curriculum:
      type: object
      required: [id, name, subject, grade, description, version, status, dateAdded, lastUpdated, reviewDate, filesCount]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string }
        grade: { type: string }
        description: { type: string }
        publisher: { type: string }
        version: { type: string }
        status: { type: string, enum: [current, needs_review, needs_upgrade, archived] }
        dateAdded: { type: string, format: date }
        lastUpdated: { type: string, format: date }
        reviewDate: { type: string, format: date }
        notes: { type: string }
        filesCount: { type: integer }
    CurriculumInput:
      type: object
      required: [name, subject, grade, description, version, status, reviewDate]
      properties:
        name: { type: string, minLength: 1 }
        subject: { type: string }
        grade: { type: string }
        description: { type: string }
        publisher: { type: string }
        version: { type: string }
        status: { type: string, enum: [current, needs_review, needs_upgrade, archived] }
        reviewDate: { type: string, format: date }
        notes: { type: string }
    CurriculumUpdate:
      allOf:
        - $ref: "#/components/schemas/CurriculumInput"
    FreelancerProject:
      type: object
      required: [id, name, client, description, dateCreated, deadline, status, hourlyRate, totalHours, totalCost, proposalCount]
      properties:
        id: { type: integer }
        name: { type: string }
        client: { type: string }
        description: { type: string }
        dateCreated: { type: string, format: date }
        deadline: { type: string, format: date }
        status: { type: string, enum: [idea, proposal, pending, accepted, working, completed, cancelled] }
        hourlyRate: { type: number }
        totalHours: { type: number }
        totalCost: { type: number }
        proposalCount: { type: integer }
    FreelancerProjectInput:
      type: object
      required: [name, client, description, deadline, status, hourlyRate]
      properties:
        name: { type: string, minLength: 1 }
        client: { type: string }
        description: { type: string }
        deadline: { type: string, format: date }
        status: { type: string, enum: [idea, proposal, pending, accepted, working, completed, cancelled] }
        hourlyRate: { type: number, minimum: 0 }
    FreelancerProjectUpdate:
      allOf:
        - $ref: "#/components/schemas/FreelancerProjectInput"
    TimeEntry:
      type: object
      required: [id, projectId, date, duration, description, hourlyRate, calculatedCost]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        date: { type: string, format: date }
        duration: { type: number }
        description: { type: string }
        hourlyRate: { type: number }
        calculatedCost: { type: number }
    TimeEntryInput:
      type: object
      required: [date, duration, description, hourlyRate]
      properties:
        date: { type: string, format: date }
        duration: { type: number, minimum: 0.01 }
        description: { type: string }
        hourlyRate: { type: number, minimum: 0 }
    Proposal:
      type: object
      required: [id, opportunityName, clientType, version, content, approach, date, result, won, whatWorked]
      properties:
        id: { type: integer }
        projectId: { type: ["integer", "null"] }
        opportunityName: { type: string }
        clientType: { type: string }
        version: { type: string }
        content: { type: string }
        approach: { type: string }
