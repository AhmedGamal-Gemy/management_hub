services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # No LITELLM_PROXY_URL here: without it the backend calls the
      # litellm package in-process (library mode). See TECHNICAL_PLAN.md.
      LITELLM_MODEL: ${LITELLM_MODEL:-groq/llama-3.3-70b-versatile}
    volumes:
      - ./backend:/app
